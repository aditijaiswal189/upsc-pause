<link rel="canonical" href="https://upsc-pause.wtf/">

<!-- The share card. This site spreads by someone pasting the link into a
     WhatsApp group or on X — the preview is what decides whether anyone taps
     it, so it matters more here than any keyword ever will. -->

<meta property="og:site_name" content="संकल्प लाइब्रेरी">
<meta property="og:locale" content="hi_IN">
<meta property="og:title" content="संकल्प लाइब्रेरी">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="संकल्प लाइब्रेरी">

<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./favicon.svg">
<link rel="stylesheet" href="./styles.css">

<!-- Vercel Web Analytics. Cookieless, so no consent banner — which matters on
     a page whose whole promise is that it does not ask anything of you.
     Enable Analytics in the Vercel dashboard or this 404s silently. -->
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<!-- The room.
     In the HTML, not loaded from JS, so the browser's preload scanner starts
     fetching it while it is still parsing the head — in parallel with the CSS
     and the module. Loading it from JavaScript meant the request could not
     begin until main.js had run, and the placeholder underneath was on screen
     for the whole of that download.
     <picture> also does the orientation choice natively, so no resize listener. -->
<div class="scene" aria-hidden="true">
  <picture>
    <source media="(orientation: portrait)" type="image/avif" srcset="./assets/room-portrait.avif">
    <source media="(orientation: portrait)" type="image/webp" srcset="./assets/room-portrait.webp">
    <source type="image/avif" srcset="./assets/room.avif">
    <source type="image/webp" srcset="./assets/room.webp">
    <img id="roomPhoto" class="room-photo" src="./assets/room.webp" alt="" decoding="async" fetchpriority="high">
  </picture>
</div>
<!-- top bar -->
<header class="bar">
  <div class="left"><span id="clock">—</span></div>
  <div class="centre">
    <span class="presence" id="presence" hidden><i class="dot"></i><b id="onlineCount">—</b> साथ में</span>
  </div>
  <div class="right">
    <a id="ytLink" href="#" target="_blank" rel="noopener noreferrer" hidden>YT Music ↗</a>
  </div>
</header>

<!-- title -->
<main class="title">
  <h1>संकल्प<br>लाइब्रेरी</h1>
  <p class="line" id="line">थोड़ी देर बैठ जा।</p>
</main>

<!-- bottom controls -->
<footer class="dock">
  <div class="pill player" id="playerPill">
    <img id="cover" class="cover" alt="" hidden>
    <div class="meta">
      <div class="track" id="trackTitle">कुछ नहीं चल रहा</div>
      <div class="artist" id="trackArtist">add track IDs in tracks.js</div>
      <div class="bar-wrap"><div class="bar-fill" id="progress"></div></div>
    </div>
    <div class="controls">
      <button id="prev" aria-label="Previous">⏮</button>
      <button id="play" class="primary" aria-label="Play">▶</button>
      <button id="next" aria-label="Next">⏭</button>
    </div>
  </div>

  <div class="pill row">
    <button id="t15" class="chip">15 मिनट</button>
    <button id="t25" class="chip">25 मिनट</button>
    <span class="timer" id="timer" hidden>—</span>
  </div>
</footer>

<div id="ytHost" class="yt-host"></div>

<script type="module" src="./main.js"></script>
</body>
</html>
