<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>संकल्प लाइब्रेरी · थोड़ी देर बैठ जा</title>
<meta name="description" content="A room to sit in for a while, between revisions.">
<meta name="theme-color" content="#07090d">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<!-- The room. One illustration, a few things that breathe.
     Composition note: the SVG is `slice`-cropped, so on a portrait phone only
     roughly x∈[240,960] survives. Everything that matters lives inside that
     band, and the upper middle is left clear for the title. -->
<div class="scene" aria-hidden="true">
  <!-- The real artwork goes here. Drop a file at assets/room.avif (or .webp/.jpg)
       and it replaces the vector placeholder below automatically.
       See ART.md for the generation prompt and specs. -->
  <img id="roomPhoto" class="room-photo" alt="" hidden>

  <svg id="roomVector" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"   stop-color="#0e1420"/>
        <stop offset="0.6" stop-color="#080b12"/>
        <stop offset="1"   stop-color="#05070a"/>
      </linearGradient>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"   stop-color="#141d33"/>
        <stop offset="0.7" stop-color="#1b2135"/>
        <stop offset="1"   stop-color="#2a2233"/>
      </linearGradient>
      <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"    stop-color="#3a2a1e"/>
        <stop offset="0.12" stop-color="#2a1e15"/>
        <stop offset="1"    stop-color="#120c08"/>
      </linearGradient>
      <radialGradient id="lampPool" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0"    stop-color="#ffc879" stop-opacity="0.5"/>
        <stop offset="0.45" stop-color="#ff9f4d" stop-opacity="0.14"/>
        <stop offset="1"    stop-color="#ff9f4d" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="tubeGlow" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="#cfe4ff" stop-opacity="0.26"/>
        <stop offset="1" stop-color="#cfe4ff" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="farLamp" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="#ffb765" stop-opacity="0.5"/>
        <stop offset="1" stop-color="#ffb765" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="vign" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"    stop-color="#000" stop-opacity="0.5"/>
        <stop offset="0.34" stop-color="#000" stop-opacity="0"/>
        <stop offset="0.72" stop-color="#000" stop-opacity="0"/>
        <stop offset="1"    stop-color="#000" stop-opacity="0.7"/>
      </linearGradient>
      <!-- Film grain. The texture is most of what stops flat vector looking cheap. -->
      <filter id="grain">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
        <feColorMatrix type="saturate" values="0"/>
      </filter>
      <!-- Depth of field. Flat vector reads as a diagram largely because every
           edge is equally sharp; blurring by distance is the cheapest way to
           buy back some realism. -->
      <filter id="dofFar" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3.2"/>
      </filter>
      <filter id="dofMid" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="1.6"/>
      </filter>
      <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="6"/>
      </filter>
      <clipPath id="winClip"><rect x="626" y="172" width="228" height="276" rx="3"/></clipPath>
    </defs>

    <rect width="1200" height="800" fill="url(#night)"/>

    <!-- window: night city, rain -->
    <g>
      <rect x="620" y="166" width="240" height="288" rx="5" fill="#0a0d14"/>
      <g clip-path="url(#winClip)" filter="url(#dofFar)">
        <rect x="626" y="172" width="228" height="276" fill="url(#sky)"/>
        <g fill="#39425a" opacity="0.9">
          <rect x="630" y="318" width="42" height="130"/><rect x="680" y="292" width="34" height="156"/>
          <rect x="722" y="336" width="52" height="112"/><rect x="784" y="306" width="38" height="142"/>
          <rect x="828" y="330" width="30" height="118"/>
        </g>
        <g class="citylights" fill="#ffc271">
          <rect x="636" y="330" width="4" height="5"/><rect x="648" y="346" width="4" height="5"/>
          <rect x="662" y="330" width="4" height="5"/><rect x="688" y="306" width="4" height="5"/>
          <rect x="700" y="328" width="4" height="5"/><rect x="688" y="358" width="4" height="5"/>
          <rect x="732" y="352" width="4" height="5"/><rect x="754" y="374" width="4" height="5"/>
          <rect x="792" y="320" width="4" height="5"/><rect x="808" y="346" width="4" height="5"/>
          <rect x="836" y="344" width="4" height="5"/><rect x="836" y="378" width="4" height="5"/>
        </g>
        <g class="rain" stroke="#a8c4de" stroke-width="1.3" opacity="0.3">
          <line x1="638" y1="0" x2="631" y2="24"/><line x1="676" y1="0" x2="669" y2="24"/>
          <line x1="712" y1="0" x2="705" y2="24"/><line x1="748" y1="0" x2="741" y2="24"/>
          <line x1="786" y1="0" x2="779" y2="24"/><line x1="822" y1="0" x2="815" y2="24"/>
          <line x1="658" y1="0" x2="651" y2="24"/><line x1="844" y1="0" x2="837" y2="24"/>
        </g>
      </g>
      <g fill="#161b26">
        <rect x="620" y="166" width="240" height="8"/><rect x="620" y="446" width="240" height="8"/>
        <rect x="620" y="166" width="8" height="288"/><rect x="852" y="166" width="8" height="288"/>
        <rect x="736" y="166" width="7" height="288"/>
      </g>
    </g>

    <!-- ceiling fan, left of the title -->
    <g class="fan" transform="translate(372 92)" filter="url(#dofMid)">
      <line x1="0" y1="-92" x2="0" y2="-8" stroke="#1b202b" stroke-width="6"/>
      <g class="fanblades">
        <ellipse cx="68" cy="0" rx="68" ry="9" fill="#232a38"/>
        <ellipse cx="68" cy="0" rx="68" ry="9" fill="#1e2532" transform="rotate(120)"/>
        <ellipse cx="68" cy="0" rx="68" ry="9" fill="#1e2532" transform="rotate(240)"/>
      </g>
      <circle r="13" fill="#2b3342"/>
    </g>

    <!-- tubelight, upper left -->
    <g class="tube">
      <ellipse cx="330" cy="192" rx="250" ry="112" fill="url(#tubeGlow)"/>
      <rect x="256" y="186" width="176" height="11" rx="5" fill="#dfeaff" opacity="0.82"/>
      <rect x="256" y="180" width="176" height="6" rx="3" fill="#33404f"/>
    </g>

    <!-- other desks, still occupied -->
    <g class="others" filter="url(#dofMid)">
      <g><ellipse cx="318" cy="462" rx="74" ry="42" fill="url(#farLamp)"/>
         <rect x="270" y="462" width="100" height="8" rx="3" fill="#1d1610"/>
         <rect x="302" y="442" width="30" height="20" fill="#241c14"/></g>
      <g><ellipse cx="486" cy="476" rx="66" ry="38" fill="url(#farLamp)" opacity="0.72"/>
         <rect x="442" y="476" width="90" height="7" rx="3" fill="#1a140f"/>
         <rect x="470" y="459" width="27" height="17" fill="#211a13"/></g>
      <g><ellipse cx="602" cy="468" rx="58" ry="34" fill="url(#farLamp)" opacity="0.5"/>
         <rect x="562" y="468" width="80" height="7" rx="3" fill="#181209"/></g>
    </g>

    <!-- foreground desk -->
    <ellipse cx="600" cy="646" rx="430" ry="196" fill="url(#lampPool)"/>
    <rect x="0" y="588" width="1200" height="212" fill="url(#desk)"/>
    <rect x="0" y="588" width="1200" height="4" fill="#4d3826" opacity="0.75"/>

    <!-- book stack, left -->
    <g transform="translate(262 512)">
      <rect y="60" width="208" height="19" rx="3" fill="#5d3a34"/><rect y="60" width="208" height="5" fill="#7b4f45"/>
      <rect x="10" y="43" width="190" height="18" rx="3" fill="#2f4353"/><rect x="10" y="43" width="190" height="5" fill="#456073"/>
      <rect x="4" y="26" width="200" height="18" rx="3" fill="#4a4632"/><rect x="4" y="26" width="200" height="5" fill="#655f42"/>
      <rect x="16" y="9" width="178" height="18" rx="3" fill="#3d3350"/><rect x="16" y="9" width="178" height="5" fill="#55476d"/>
    </g>

    <!-- open notebook, centre -->
    <g transform="translate(462 604)">
      <path d="M0 74 L13 8 L142 8 L136 74 Z" fill="#e9dfc6"/>
      <path d="M142 8 L271 8 L282 74 L136 74 Z" fill="#f2e9d3"/>
      <line x1="140" y1="10" x2="137" y2="72" stroke="#c9bb9a" stroke-width="2"/>
      <g stroke="#9aa8bd" stroke-width="2" opacity="0.7">
        <line x1="26" y1="25" x2="130" y2="25"/><line x1="24" y1="38" x2="128" y2="38"/>
        <line x1="22" y1="51" x2="112" y2="51"/>
        <line x1="153" y1="25" x2="265" y2="25"/><line x1="155" y1="38" x2="267" y2="38"/>
        <line x1="157" y1="51" x2="234" y2="51"/>
      </g>
      <rect x="182" y="59" width="90" height="7" rx="3" fill="#e8b34a" opacity="0.6"/>
    </g>

    <!-- pen -->
    <g transform="translate(410 690) rotate(-13)">
      <rect width="110" height="7" rx="3.5" fill="#22303f"/>
      <rect x="99" width="15" height="7" rx="3" fill="#8f9bab"/>
      <rect x="24" width="17" height="7" fill="#3d5064"/>
    </g>

    <!-- chai -->
    <g transform="translate(772 596)">
      <path class="steam"    d="M20 -24 C8 -42 32 -50 20 -70"  stroke="#cbd6e4" stroke-width="3" fill="none" opacity="0.26" stroke-linecap="round"/>
      <path class="steam s2" d="M41 -18 C29 -38 53 -46 41 -68" stroke="#cbd6e4" stroke-width="3" fill="none" opacity="0.18" stroke-linecap="round"/>
      <path d="M5 0 L13 70 L51 70 L59 0 Z" fill="#c9d2dd" opacity="0.26"/>
      <path d="M8 17 L14 66 L50 66 L56 17 Z" fill="#9c6134"/>
      <ellipse cx="32" cy="17" rx="24" ry="6" fill="#b97a46"/>
    </g>

    <!-- spectacles -->
    <g transform="translate(292 646)" fill="none" stroke="#7f8ea0" stroke-width="4" opacity="0.8">
      <circle cx="24" cy="13" r="19"/><circle cx="82" cy="13" r="19"/><path d="M43 11 L63 11"/>
    </g>

    <!-- desk lamp, right. The head points down-left at the notebook, and the
         cone is drawn from the shade mouth so the light has a visible source —
         without that the lamp reads as furniture rather than as the thing
         lighting the desk. -->
    <g transform="translate(806 402)">
      <path class="lampcone" d="M44 70 L-150 300 L150 300 Z" fill="url(#lampPool)" opacity="0.62"/>
      <ellipse cx="44" cy="72" rx="34" ry="11" fill="#ffcf8d" opacity="0.5"/>
      <rect x="0" y="178" width="86" height="10" rx="5" fill="#2a3140"/>
      <ellipse cx="43" cy="178" rx="43" ry="6" fill="#3a4354"/>
      <line x1="43" y1="178" x2="20" y2="88" stroke="#2a3140" stroke-width="7"/>
      <line x1="20" y1="88" x2="72" y2="52" stroke="#2a3140" stroke-width="7"/>
      <path d="M78 34 L96 62 L44 78 L20 56 Z" fill="#39435a"/>
      <path d="M78 34 L96 62 L74 66 L62 42 Z" fill="#4a566f"/>
    </g>

    <!-- seat plate on the desk edge -->
    <g transform="translate(268 718)" opacity="0.58">
      <rect width="98" height="38" rx="5" fill="#1b2330" stroke="#31404f" stroke-width="2"/>
      <text x="49" y="26" text-anchor="middle" font-family="ui-monospace, Menlo, monospace"
            font-size="18" fill="#8fa2b8" letter-spacing="2">सीट १४</text>
    </g>

    <rect width="1200" height="800" fill="url(#vign)"/>
    <rect width="1200" height="800" filter="url(#grain)" opacity="0.05" style="mix-blend-mode:overlay"/>
  </svg>
</div>

<!-- top bar -->
<header class="bar">
  <div class="left">
    <span id="clock">—</span>
    <span class="presence" id="presence" hidden><i class="dot"></i><b id="onlineCount">—</b> साथ में</span>
  </div>
  <div class="right">
    <a id="ytLink" href="#" target="_blank" rel="noopener noreferrer" hidden>YT Music ↗</a>
  </div>
</header>

<!-- title -->
<main class="title">
  <h1>संकल्प<br>लाइब्रेरी</h1>
  <p class="line" id="line">थोड़ी देर बैठ जा।</p>
</main>

<!-- bottom controls -->
<footer class="dock">
  <div class="pill player" id="playerPill">
    <img id="cover" class="cover" alt="" hidden>
    <div class="meta">
      <div class="track" id="trackTitle">कुछ नहीं चल रहा</div>
      <div class="artist" id="trackArtist">add track IDs in tracks.js</div>
      <div class="bar-wrap"><div class="bar-fill" id="progress"></div></div>
    </div>
    <div class="controls">
      <button id="prev" aria-label="Previous">⏮</button>
      <button id="play" class="primary" aria-label="Play">▶</button>
      <button id="next" aria-label="Next">⏭</button>
    </div>
  </div>

  <div class="pill row">
    <button id="t15" class="chip">15 मिनट</button>
    <button id="t25" class="chip">25 मिनट</button>
    <span class="timer" id="timer" hidden>—</span>
  </div>
</footer>

<div id="ytHost" class="yt-host"></div>

<script type="module" src="./main.js"></script>
</body>
</html>
